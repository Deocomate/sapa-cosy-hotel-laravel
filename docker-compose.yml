services:
  # ===========================================================================
  # Laravel Application (PHP-FPM + Nginx)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sapacosyhotel-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    expose:
      - "80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Sapa Cosy Hotel}"
      APP_ENV: "${APP_ENV:-production}"
      APP_MODE: "${APP_MODE:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Ho_Chi_Minh}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-db_sapacosyhotel}"
      DB_USERNAME: "${DB_USERNAME:-sapacosyhotel}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-error}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Sapa Cosy Hotel}"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - sapacosyhotel-network

  # ===========================================================================
  # MySQL Database
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: sapacosyhotel-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-db_sapacosyhotel}"
      MYSQL_USER: "${DB_USERNAME:-sapacosyhotel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sapacosyhotel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

# =============================================================================
# Volumes - Persistent Data
# =============================================================================
volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  sapacosyhotel-network:
    driver: bridge
